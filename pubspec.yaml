name: safeauth
description: Auth No Ads — personal authenticator and password vault. Encrypted on-device, fingerprint unlock, no ads.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  crypto: ^3.0.6
  convert: ^3.1.2
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  local_auth_android: ^1.0.49
  mobile_scanner: ^6.0.11
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.1.7 # android compileSdk forced to 36 in Gradle overlay
  device_info_plus: ^11.2.0
  uuid: ^4.5.1
  intl: ^0.20.1
  permission_handler: ^11.3.1
  http: ^1.2.2
  collection: ^1.19.0
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brands/

